# =============================================================================
# Discipular SaaS — proxy reverso
#
# Instalar em:  /etc/nginx/conf.d/discipular.conf
# Validar:      sudo nginx -t
# Aplicar:      sudo systemctl reload nginx     (reload, nunca restart)
#
# Requer nginx >= 1.25.1 (diretiva `http2 on`) e >= 1.19.4
# (`ssl_reject_handshake`). O nginx do Ubuntu 24.04 já atende.
#
# Este arquivo é a PRIMEIRA camada de defesa do sistema. O modelo multi-tenant
# inteiro depende de o hostname que chega à aplicação ser confiável: o tenant é
# resolvido a partir dele (src/lib/tenant/resolve.ts) e de mais nada. Daí o
# cuidado obsessivo com `server_name` e com o `default_server` do bloco 1.
#
# Para adicionar o domínio de uma igreja nova, ver nginx/README.md.
# =============================================================================

# -----------------------------------------------------------------------------
# Backend
# -----------------------------------------------------------------------------
upstream discipular_app {
    # O container publica em 127.0.0.1:3000 (loopback do host), nunca em
    # 0.0.0.0 — senão daria para bater direto na porta 3000 e pular tudo que
    # está configurado neste arquivo.
    server 127.0.0.1:3000 max_fails=3 fail_timeout=15s;

    # Mantém conexões vivas com o Node. Sem isso, cada requisição paga um
    # handshake TCP novo; com ~90 usuários simultâneos é CPU jogada fora.
    keepalive 64;
    keepalive_timeout 60s;
}

# WebSocket/SSE precisam do header Upgrade repassado, mas só quando ele existe.
# Repassar "Upgrade" vazio quebra requisição HTTP comum.
map $http_upgrade $conexao_upgrade {
    default upgrade;
    ''      close;
}

# -----------------------------------------------------------------------------
# Rate limiting
#
# Estes limites são um ESCUDO CONTRA ENXURRADA, grosseiro de propósito. O rate
# limit fino — por usuário, por tenant e por ação — é feito na aplicação
# (src/lib/security/rate-limit.ts), que é o único lugar que sabe QUEM está
# fazendo a requisição. Aqui só existe o IP.
#
# Consequência prática: uma igreja inteira costuma sair por um único IP (NAT da
# secretaria, Wi-Fi do templo). Por isso os valores são generosos — apertar
# demais aqui bloqueia gente legítima, e a defesa fina está na camada de cima.
#
# `$binary_remote_addr` em vez de `$remote_addr` porque ocupa 4 bytes (IPv4) em
# vez de até 15: em 10 MB cabem ~160 mil IPs distintos.
# -----------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=zona_api:10m   rate=20r/s;
limit_req_zone $binary_remote_addr zone=zona_login:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=zona_geral:10m rate=60r/s;

# Conexões simultâneas por IP. Barra o cliente que abre centenas de conexões
# ociosas só para esgotar os worker_connections do servidor.
limit_conn_zone $binary_remote_addr zone=zona_conexoes:10m;

# Ao barrar devolvemos 429 (o padrão do nginx é 503). 429 é o código correto e
# permite distinguir "você excedeu" de "o servidor caiu".
limit_req_status  429;
limit_conn_status 429;

# Excesso é logado como `warn`, não `error`: rate limit disparando é operação
# normal e não deve poluir o canal usado para incidente de verdade.
limit_req_log_level warn;

# -----------------------------------------------------------------------------
# Compressão
#
# `gzip_proxied any` é necessário porque as respostas vêm de um proxy_pass.
# Sobre BREACH: a mitigação aqui é que o token CSRF é assinado e rotativo
# (src/lib/security/csrf.ts) e o cookie de sessão nunca é refletido no corpo
# da resposta — não há segredo estável dentro do HTML comprimido.
# -----------------------------------------------------------------------------
gzip              on;
gzip_vary         on;
gzip_proxied      any;
gzip_comp_level   5;
gzip_min_length   1024;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml
    application/rss+xml
    application/manifest+json
    image/svg+xml
    font/woff
    font/woff2;

# -----------------------------------------------------------------------------
# TLS — parâmetros comuns a todos os server blocks (contexto http)
# -----------------------------------------------------------------------------
# TLSv1.0 e 1.1 estão mortos (POODLE, BEAST) e reprovam em qualquer auditoria.
# TLSv1.2 permanece porque ainda há celular Android antigo nas igrejas.
ssl_protocols TLSv1.2 TLSv1.3;

# Só suítes com forward secrecy (ECDHE) e AEAD (GCM/ChaCha20). Sem CBC, sem RSA
# estático: se a chave privada vazar amanhã, o tráfego capturado hoje continua
# ilegível.
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

# Em TLS 1.3 a ordem é irrelevante; em 1.2, deixar o cliente escolher evita
# forçar AES em celular sem AES-NI, onde ChaCha20 é muito mais rápido.
ssl_prefer_server_ciphers off;

ssl_session_cache   shared:TLS_DISCIPULAR:20m;
ssl_session_timeout 1d;

# Session tickets desligados: a chave de ticket do nginx não rotaciona sozinha,
# e chave estática anula o forward secrecy que as suítes ECDHE garantem.
ssl_session_tickets off;

# OCSP stapling: o servidor entrega a prova de não-revogação junto do
# certificado. Isso evita que o navegador consulte a CA (o que revelaria à CA
# quais sites cada visitante acessa) e economiza um RTT no handshake.
#
# NOTA OPERACIONAL: a Let's Encrypt encerrou seus respondedores OCSP em 2025.
# Com certificado LE estas diretivas viram no-op inofensivo (o nginx só
# registra um aviso no error.log); ficam ligadas porque o arquivo também
# atende certificados de outras CAs. E, com LE, JAMAIS emita certificado com a
# extensão "must-staple": sem OCSP para grampear, o site fica inacessível.
ssl_stapling        on;
ssl_stapling_verify on;

# Resolver necessário para o stapling consultar a CA. `ipv6=off` evita timeout
# em VPS sem IPv6 funcional.
resolver         1.1.1.1 9.9.9.9 valid=300s ipv6=off;
resolver_timeout 5s;

# Não anunciar a versão do nginx no header Server nem nas páginas de erro. Não
# é defesa real, mas tira o servidor de varredura automatizada que filtra por
# versão vulnerável conhecida.
server_tokens off;

# =============================================================================
# BLOCO 1 — DEFAULT_SERVER: tudo que não bate com nenhum server_name morre aqui
#
# ESTE É O BLOCO MAIS IMPORTANTE DO ARQUIVO.
#
# Sem um default_server explícito, o nginx elege o PRIMEIRO server block como
# padrão. Uma requisição com `Host: qualquer-coisa` cairia então num tenant
# real, e a aplicação resolveria o tenant a partir de um host escolhido pelo
# atacante. Todo o isolamento multi-tenant depende de isso ser impossível.
#
# `return 444` é um código interno do nginx: fecha a conexão sem responder
# absolutamente nada. Escolhido em vez de 403 porque não confirma nem que
# existe um servidor aqui — scanner automatizado não ganha informação nenhuma.
# =============================================================================
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    # Nem redirect para HTTPS: host desconhecido não merece resposta.
    return 444;
}

server {
    listen      443 ssl default_server;
    listen      [::]:443 ssl default_server;
    http2       on;
    server_name _;

    # Rejeita o handshake TLS antes de apresentar qualquer certificado. Evita
    # ter que manter um certificado autoassinado só para o bloco-lixo (que
    # geraria alerta de certificado inválido e ainda confirmaria a existência
    # do servidor). Requer nginx >= 1.19.4.
    ssl_reject_handshake on;

    return 444;
}

# =============================================================================
# BLOCO 2 — HTTP -> HTTPS para os hosts que reconhecemos
#
# Só redireciona quem tem nome conhecido; qualquer outro Host já morreu no
# bloco 1.
# =============================================================================
server {
    listen 80;
    listen [::]:80;

    # AJUSTE AQUI: domínio raiz da plataforma, o wildcard de subdomínio e cada
    # domínio próprio de igreja. Manter em sincronia com os blocos 3 e 4.
    server_name discipular.app *.discipular.app
                igrejaexemplo.com.br www.igrejaexemplo.com.br;

    # Exceção obrigatória: o certbot serve o desafio HTTP-01 em texto claro. Se
    # isto for redirecionado, a renovação automática falha silenciosamente e o
    # site cai 90 dias depois — sempre num domingo de manhã.
    # `^~` garante prioridade sobre as regex deste bloco.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        access_log off;
    }

    # 301 permanente para o navegador memorizar. Junto com o HSTS que a
    # aplicação envia, o segundo acesso do usuário nem passa por HTTP.
    location / {
        return 301 https://$host$request_uri;
    }
}

# =============================================================================
# BLOCO 3 — PLATAFORMA: domínio raiz + wildcard de subdomínio
#
#   discipular.app     -> site institucional e login central
#   *.discipular.app   -> cada igreja no seu subdomínio
#
# Exige certificado WILDCARD, que só pode ser emitido por DNS-01.
# Passo a passo em nginx/README.md.
# =============================================================================
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name discipular.app *.discipular.app;

    ssl_certificate         /etc/letsencrypt/live/discipular.app/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/discipular.app/privkey.pem;
    # Cadeia usada para VALIDAR a resposta OCSP. Sem ela, ssl_stapling_verify
    # não tem como conferir a assinatura e o stapling é desligado.
    ssl_trusted_certificate /etc/letsencrypt/live/discipular.app/chain.pem;

    # -------------------------------------------------------------------------
    # Limites de corpo e de tempo
    # -------------------------------------------------------------------------
    # 6 MB: o app aceita upload de até 5 MB (MAX_UPLOAD_BYTES) e Server Actions
    # de até 2 MB. A folga cobre o overhead do multipart. O lugar de cortar
    # payload gigante é AQUI, antes de o Node alocar memória para ele.
    client_max_body_size 6m;
    client_body_timeout  20s;
    client_header_timeout 20s;
    # Corpo pequeno fica em memória; acima disso vai para disco, em vez de
    # inflar o buffer do worker.
    client_body_buffer_size 128k;
    # Slowloris: conexão ociosa não fica pendurada segurando worker.
    send_timeout 30s;

    # Teto de conexões simultâneas por IP (zona declarada no topo do arquivo).
    limit_conn zona_conexoes 40;

    # -------------------------------------------------------------------------
    # Headers de proxy — declarados no contexto `server` e herdados por todos
    # os `location` abaixo (nenhum deles redefine proxy_set_header, que é a
    # condição para a herança valer no nginx).
    # -------------------------------------------------------------------------
    # Host: repassa o hostname ORIGINAL. É dele que a aplicação deriva o
    # tenant. Usar $proxy_host aqui apontaria tudo para "discipular_app" e o
    # sistema inteiro perderia a noção de qual igreja está sendo acessada.
    proxy_set_header Host              $host;

    # $remote_addr é o IP do peer TCP: o nginx o observa do socket, o cliente
    # não tem como escolhê-lo. Sobrescrevemos X-Forwarded-For em vez de usar
    # $proxy_add_x_forwarded_for justamente para DESCARTAR qualquer cadeia que
    # o cliente tenha enviado — com um só proxy na frente, preservar a cadeia
    # do cliente não agrega nada e só cria superfície para forjar IP e escapar
    # do rate limit da aplicação. Mantenha TRUSTED_PROXY_HOPS=1 no .env.
    # (Se um dia entrar Cloudflare na frente: use o módulo real_ip com
    # set_real_ip_from nas faixas da CF e ajuste TRUSTED_PROXY_HOPS.)
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;

    # O TLS termina aqui; sem isto o app se acha em HTTP e gera link absoluto
    # errado, além de poder recusar marcar o cookie de sessão como Secure.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    # Higiene: apaga headers internos que o middleware usa como contexto
    # confiável. O middleware já os sobrescreve, mas header vazio no nginx é
    # header removido — defesa em profundidade custa zero aqui.
    proxy_set_header X-Discipular-Host "";
    proxy_set_header X-Discipular-Ip   "";
    proxy_set_header X-Discipular-Nonce "";

    # keepalive com o upstream exige HTTP/1.1 e Connection controlado.
    proxy_http_version 1.1;
    proxy_set_header Connection $conexao_upgrade;
    proxy_set_header Upgrade    $http_upgrade;

    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # Não repassar a resposta de erro crua do Node para o navegador quando o
    # upstream devolve 5xx sem corpo útil.
    proxy_intercept_errors off;

    # -------------------------------------------------------------------------
    # Bloqueios de caminho
    # -------------------------------------------------------------------------
    # /.git é o clássico: um clone esquecido dentro de um webroot entrega o
    # código-fonte inteiro e, com ele, segredos do histórico. Bloqueamos todo
    # arquivo iniciado por ponto (.git, .env, .htpasswd, .DS_Store) e abrimos
    # exceção só para /.well-known, que é padrão público (ACME, security.txt).
    # O Next não serve nada disso de qualquer forma — este bloco é a rede de
    # segurança para o dia em que alguém apontar um `root` para o lugar errado.
    location ~ /\.(?!well-known/) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        access_log off;
    }

    # -------------------------------------------------------------------------
    # Rotas com limite mais apertado
    # -------------------------------------------------------------------------
    # Login: alvo número um de força bruta e credential stuffing. 12/min por IP
    # com burst 5 e SEM `nodelay` — as tentativas do burst são enfileiradas e
    # servidas devagar, o que estraga o rendimento do atacante sem devolver
    # erro para quem só errou a senha duas vezes.
    location = /login {
        limit_req zone=zona_login burst=5;
        proxy_pass http://discipular_app;
    }

    location = /api/auth/login {
        limit_req zone=zona_login burst=5;
        proxy_pass http://discipular_app;
    }

    # Demais APIs: 20 r/s com burst 40 e `nodelay`, porque o painel dispara
    # várias chamadas em paralelo ao abrir uma tela. `nodelay` serve o burst na
    # hora e só depois aplica a taxa — bom para rajada legítima, ruim para
    # enxurrada sustentada, que é exatamente o comportamento desejado.
    location /api/ {
        limit_req zone=zona_api burst=40 nodelay;
        # Resposta de API nunca é bufferizada nem cacheada por intermediário:
        # cache compartilhado é o caminho mais curto para uma igreja receber a
        # resposta gerada para outra.
        proxy_buffering off;
        proxy_pass http://discipular_app;
    }

    # Assets com hash no nome. O Next já responde com
    # `Cache-Control: immutable`, então nada de `expires` aqui: duas fontes
    # mandando no cache é como se acaba servindo bundle velho depois do deploy.
    location /_next/static/ {
        access_log off;
        proxy_pass http://discipular_app;
    }

    location / {
        limit_req zone=zona_geral burst=100 nodelay;
        proxy_pass http://discipular_app;
    }
}

# =============================================================================
# BLOCO 4 — DOMÍNIO PRÓPRIO DE IGREJA (modelo)
#
# Copie este bloco inteiro para cada igreja com domínio próprio, trocando o
# server_name e o caminho do certificado. Passo a passo em nginx/README.md.
#
# O host também precisa estar cadastrado e VERIFICADO na tabela tenant_domains,
# senão a aplicação devolve 404 mesmo com o nginx configurado. As duas pontas
# têm que concordar, e é assim de propósito: configurar um domínio no nginx
# não concede acesso a dado nenhum.
# =============================================================================
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name igrejaexemplo.com.br www.igrejaexemplo.com.br;

    ssl_certificate         /etc/letsencrypt/live/igrejaexemplo.com.br/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/igrejaexemplo.com.br/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/igrejaexemplo.com.br/chain.pem;

    client_max_body_size 6m;
    client_body_timeout  20s;
    client_header_timeout 20s;
    client_body_buffer_size 128k;
    send_timeout 30s;
    limit_conn zona_conexoes 40;

    # Mesmos headers do bloco 3 — ver lá os comentários de cada um.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_set_header X-Discipular-Host "";
    proxy_set_header X-Discipular-Ip   "";
    proxy_set_header X-Discipular-Nonce "";
    proxy_http_version 1.1;
    proxy_set_header Connection $conexao_upgrade;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    location ~ /\.(?!well-known/) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        access_log off;
    }

    location = /login {
        limit_req zone=zona_login burst=5;
        proxy_pass http://discipular_app;
    }

    location = /api/auth/login {
        limit_req zone=zona_login burst=5;
        proxy_pass http://discipular_app;
    }

    location /api/ {
        limit_req zone=zona_api burst=40 nodelay;
        proxy_buffering off;
        proxy_pass http://discipular_app;
    }

    location /_next/static/ {
        access_log off;
        proxy_pass http://discipular_app;
    }

    location / {
        limit_req zone=zona_geral burst=100 nodelay;
        proxy_pass http://discipular_app;
    }
}
